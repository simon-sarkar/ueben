<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Gültig oder ungültig?</title>
<link rel="stylesheet" href="../../../basis/stil.css">
<style>
  .adresse { font-family: var(--kopf); font-weight: 600; font-size: 1.75em; text-align: center; letter-spacing: .02em;
    background: var(--bg); border-radius: 12px; padding: 12px 8px; margin: 4px 0 14px; overflow-wrap: anywhere; }
  .liste .ip { font-family: var(--kopf); font-weight: 600; }
  @media (max-width: 380px) { .adresse { font-size: 1.55em; } }
</style>
</head>
<body>
<main class="seite" id="app"></main>
<script src="../../../basis/kern.js"></script>
<script>
(function () {
  "use strict";
  /*IP*/
  /* IPv4 wie im Unterricht: genau vier Zahlen von 0 bis 255, durch Punkte getrennt.
     Privat: 192.168.x.x, 10.x.x.x, 172.16.x.x bis 172.31.x.x; jede andere gültige Adresse ist hier öffentlich.
     Die Zuordnung wird immer gerechnet, nie von Hand gesetzt. */
  const IP = {};
  const g = U.ganz;
  IP.ZW = ["keine", "eine", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht"];
  IP.pruefe = s => {
    const t = String(s).split(".");
    if (t.length < 4) return { ok: false, grund: `nur ${IP.ZW[t.length]} Zahlen` };
    if (t.length > 4) return { ok: false, grund: `${IP.ZW[t.length]} Zahlen statt vier` };
    for (const x of t) {
      if (x === "") return { ok: false, grund: "ein Teil ist leer (zwei Punkte hintereinander)" };
      const b = x.match(/[a-zA-ZäöüÄÖÜß]/);
      if (b) return { ok: false, grund: `Buchstabe „${b[0]}“ statt Zahl` };
      if (!/^\d+$/.test(x)) return { ok: false, grund: `„${x}“ ist keine Zahl` };
      if (Number(x) > 255) return { ok: false, grund: `${x} ist größer als 255` };
    }
    const rand = t.some(x => x === "0" || x === "255");
    return { ok: true, grund: "vier Zahlen, alle von 0 bis 255" + (rand ? " (0 und 255 sind erlaubt)" : "") };
  };
  /* nur für gültige Adressen: privat oder öffentlich, mit Erkennungszeichen */
  IP.art = s => {
    const [a, b] = String(s).split(".").map(Number);
    if (a === 10) return { privat: true, zeichen: "fängt mit 10 an" };
    if (a === 192 && b === 168) return { privat: true, zeichen: "fängt mit 192.168 an" };
    if (a === 172 && b >= 16 && b <= 31) return { privat: true, zeichen: `172.${b} liegt zwischen 172.16 und 172.31` };
    if (a === 172) return { privat: false, zeichen: `172.${b} liegt nicht zwischen 172.16 und 172.31` };
    if (a === 192) return { privat: false, zeichen: `fängt mit 192.${b} an, nicht mit 192.168` };
    if (a >= 100 && a <= 109) return { privat: false, zeichen: `fängt mit ${a} an, nicht mit 10` };
    return { privat: false, zeichen: "nicht 192.168, nicht 10, nicht 172.16 bis 172.31" };
  };
  IP.typ = s => !IP.pruefe(s).ok ? "ungueltig" : IP.art(s).privat ? "privat" : "oeffentlich";
  /* schon auf Folie/AB oder aus dem Huber-Beispiel: in den Pools nicht verwenden */
  IP.SCHON = new Set(("192.168.0.1 256.10.4.7 10.0.0 172.16.254.1 192.168.1.300 8.8.8.8 192.168.178.20 10.0.0.5 172.20.4.1 " +
    "172.40.4.1 192.168.5.44 300.12.1.1 172.16.0.256 8.8.4.4 192.168.1.1.5 10.0.0.7 172.40.5.20 172.16.5.20 192.168.178.1 " +
    "91.12.44.7 192.168.2.1 192.168.2.10 192.168.2.11 192.168.2.12 192.168.2.13 84.153.27.9 142.250.185.78").split(" "));
  IP.frei = s => !IP.SCHON.has(s) && !/^192\.168\.178\./.test(s);
  /* erste Zahl für klar öffentliche Adressen (ausgedacht; keine 0, 10, 127, 172, 192, keine 224 und mehr) */
  IP.ERSTE = [5, 31, 37, 46, 62, 77, 78, 79, 80, 81, 82, 84, 85, 87, 88, 89, 93, 94, 95, 141, 145, 151, 176, 178, 185, 188,
    193, 194, 195, 212, 213, 217];
  IP.MACH = {
    p192: () => [192, 168, U.wahl([g(0, 20), g(0, 254)]), g(2, 254)],
    p10: () => [10, g(0, 255), g(0, 255), g(2, 254)],
    p172: () => [172, U.wahl([16, 31, g(16, 31), g(16, 31)]), g(0, 255), g(2, 254)],
    o: () => [U.wahl(IP.ERSTE), g(1, 254), g(0, 255), g(2, 254)],
    o172: () => [172, U.wahl([15, 32, 40, 41, g(32, 99), g(1, 14), g(100, 240)]), g(0, 255), g(2, 254)],
    o192: () => [192, U.wahl([167, 169, 186, 68]), g(0, 255), g(2, 254)],
    o10: () => [U.wahl([101, 102, 104, 105, 106, 107, 108, 109]), g(1, 254), g(0, 255), g(2, 254)]
  };
  IP.BUCHST = ["1a", "x", "4b", "e", "2c", "7f", "ab", "k3", "d"];
  /* art: Schlüssel aus IP.MACH (gültig) oder gross, g256, drei, fuenf, buchstabe, leer (ungültig) */
  IP.neu = art => {
    for (let n = 0; n < 200; n++) {
      let t;
      if (IP.MACH[art]) t = IP.MACH[art]();
      else {
        t = IP.MACH[U.wahl(["p192", "p192", "p10", "o", "p172"])]();
        const i = g(0, 3);
        if (art === "gross") t[i] = U.wahl([g(256, 299), g(300, 999), g(300, 400)]);
        if (art === "g256") t[i] = 256;
        if (art === "drei") t.splice(g(1, 3), 1);
        if (art === "fuenf") t.splice(g(1, 4), 0, g(0, 255));
        if (art === "buchstabe") t[g(1, 3)] = U.wahl(IP.BUCHST);
        if (art === "leer") t[g(1, 2)] = "";
      }
      const s = t.join(".");
      if (IP.frei(s)) return s;
    }
    throw new Error("kein freies " + art);
  };
  /*ENDIP*/

  /* Plan je Runde: 4 bis 6 gültige, der Rest ungültig; jeder Fehlertyp kommt vor, 0/255 und 256 als Randfälle */
  let plan = [], letzteI = -1;
  function planNeu() {
    const nGut = g(4, 6);
    const gut = ["rand", "rand"].concat(U.mische(["p192", "p10", "o", "p172", "o", "p192"])).slice(0, nGut);
    const schlecht = [U.wahl(["g256", "gross"]), "drei", "fuenf", "buchstabe"].concat(U.mische(["gross", "leer", "g256"])).slice(0, 10 - nGut);
    plan = U.mische(gut.concat(schlecht));
  }
  /* gültige Adresse mit 0 oder 255 an einer Stelle */
  function mitRand() {
    for (;;) {
      const t = IP.MACH[U.wahl(["p192", "p10", "o"])]();
      t[g(1, 3)] = U.wahl([0, 255]);
      const s = t.join(".");
      if (IP.frei(s)) return s;
    }
  }

  const cfg = {
    titel: "Gültig oder ungültig?",
    anzahl: 10,
    erzeuge(i) {
      if (i === 0 && letzteI !== 0) planNeu();
      letzteI = i;
      const art = plan[i], s = art === "rand" ? mitRand() : IP.neu(art), p = IP.pruefe(s);
      const ip = U.esc(s);
      return { key: s, typ: "wahl", frage: "Ist diese IPv4-Adresse gültig?", bild: `<div class="adresse">${ip}</div>`,
        optionen: ["gültig", "ungültig"], richtig: p.ok ? 0 : 1, spalten: 2,
        weg: `${U.esc(p.grund)} → ${p.ok ? "gültig" : "ungültig"}`, kurz: `<span class="ip">${ip}</span>` };
    }
  };
  window.__test = { IP, cfg, plan: () => plan, planNeu };
  U.runde(cfg);
})();
</script>
</body>
</html>
