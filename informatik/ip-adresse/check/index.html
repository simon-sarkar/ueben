<!doctype html>
<html translate="no" lang="de">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Teste dich: IP-Adresse</title>
<link rel="stylesheet" href="../../../basis/stil.css">
<style>
  .adresse { font-family: var(--kopf); font-weight: 600; font-size: 1.75em; text-align: center; letter-spacing: .02em;
    background: var(--bg); border-radius: 12px; padding: 12px 8px; margin: 4px 0 14px; overflow-wrap: anywhere; }
  .paar { font-family: var(--kopf); font-weight: 600; background: var(--bg); border-radius: 12px; padding: 10px 14px; margin: 0 0 12px; }
  .paar div { display: flex; justify-content: space-between; gap: 4px 10px; flex-wrap: wrap; }
  .paar span { color: var(--muted); font-weight: 400; font-family: var(--grund); }
  .wahl .v6 { font-family: var(--kopf); font-size: .92em; overflow-wrap: anywhere; }
  .liste .ip { font-family: var(--kopf); font-weight: 600; overflow-wrap: anywhere; }
  @media (max-width: 380px) { .adresse { font-size: 1.55em; } }
</style>
</head>
<body>
<main class="seite" id="app"></main>
<script src="../../../basis/kern.js"></script>
<script>
(function () {
  "use strict";
  /*IP*/
  /* IPv4 wie im Unterricht: genau vier Zahlen von 0 bis 255, durch Punkte getrennt.
     Privat: 192.168.x.x, 10.x.x.x, 172.16.x.x bis 172.31.x.x; jede andere gültige Adresse ist hier öffentlich.
     Die Zuordnung wird immer gerechnet, nie von Hand gesetzt. */
  const IP = {};
  const g = U.ganz;
  IP.ZW = ["keine", "eine", "zwei", "drei", "vier", "fünf", "sechs", "sieben", "acht"];
  IP.pruefe = s => {
    const t = String(s).split(".");
    if (t.length < 4) return { ok: false, grund: `nur ${IP.ZW[t.length]} Zahlen` };
    if (t.length > 4) return { ok: false, grund: `${IP.ZW[t.length]} Zahlen statt vier` };
    for (const x of t) {
      if (x === "") return { ok: false, grund: "ein Teil ist leer (zwei Punkte hintereinander)" };
      const b = x.match(/[a-zA-ZäöüÄÖÜß]/);
      if (b) return { ok: false, grund: `Buchstabe „${b[0]}“ statt Zahl` };
      if (!/^\d+$/.test(x)) return { ok: false, grund: `„${x}“ ist keine Zahl` };
      if (Number(x) > 255) return { ok: false, grund: `${x} ist größer als 255` };
    }
    const rand = t.some(x => x === "0" || x === "255");
    return { ok: true, grund: "vier Zahlen, alle von 0 bis 255" + (rand ? " (0 und 255 sind erlaubt)" : "") };
  };
  /* nur für gültige Adressen: privat oder öffentlich, mit Erkennungszeichen */
  IP.art = s => {
    const [a, b] = String(s).split(".").map(Number);
    if (a === 10) return { privat: true, zeichen: "fängt mit 10 an" };
    if (a === 192 && b === 168) return { privat: true, zeichen: "fängt mit 192.168 an" };
    if (a === 172 && b >= 16 && b <= 31) return { privat: true, zeichen: `172.${b} liegt zwischen 172.16 und 172.31` };
    if (a === 172) return { privat: false, zeichen: `172.${b} liegt nicht zwischen 172.16 und 172.31` };
    if (a === 192) return { privat: false, zeichen: `fängt mit 192.${b} an, nicht mit 192.168` };
    if (a >= 100 && a <= 109) return { privat: false, zeichen: `fängt mit ${a} an, nicht mit 10` };
    return { privat: false, zeichen: "nicht 192.168, nicht 10, nicht 172.16 bis 172.31" };
  };
  IP.typ = s => !IP.pruefe(s).ok ? "ungueltig" : IP.art(s).privat ? "privat" : "oeffentlich";
  /* schon auf Folie/AB oder aus dem Huber-Beispiel: in den Pools nicht verwenden */
  IP.SCHON = new Set(("192.168.0.1 256.10.4.7 10.0.0 172.16.254.1 192.168.1.300 8.8.8.8 192.168.178.20 10.0.0.5 172.20.4.1 " +
    "172.40.4.1 192.168.5.44 300.12.1.1 172.16.0.256 8.8.4.4 192.168.1.1.5 10.0.0.7 172.40.5.20 172.16.5.20 192.168.178.1 " +
    "91.12.44.7 192.168.2.1 192.168.2.10 192.168.2.11 192.168.2.12 192.168.2.13 84.153.27.9 142.250.185.78").split(" "));
  IP.frei = s => !IP.SCHON.has(s) && !/^192\.168\.178\./.test(s);
  /* erste Zahl für klar öffentliche Adressen (ausgedacht; keine 0, 10, 127, 172, 192, keine 224 und mehr) */
  IP.ERSTE = [5, 31, 37, 46, 62, 77, 78, 79, 80, 81, 82, 84, 85, 87, 88, 89, 93, 94, 95, 141, 145, 151, 176, 178, 185, 188,
    193, 194, 195, 212, 213, 217];
  IP.MACH = {
    p192: () => [192, 168, U.wahl([g(0, 20), g(0, 254)]), g(2, 254)],
    p10: () => [10, g(0, 255), g(0, 255), g(2, 254)],
    p172: () => [172, U.wahl([16, 31, g(16, 31), g(16, 31)]), g(0, 255), g(2, 254)],
    o: () => [U.wahl(IP.ERSTE), g(1, 254), g(0, 255), g(2, 254)],
    o172: () => [172, U.wahl([15, 32, 40, 41, g(32, 99), g(1, 14), g(100, 240)]), g(0, 255), g(2, 254)],
    o192: () => [192, U.wahl([167, 169, 186, 68]), g(0, 255), g(2, 254)],
    o10: () => [U.wahl([101, 102, 104, 105, 106, 107, 108, 109]), g(1, 254), g(0, 255), g(2, 254)]
  };
  IP.BUCHST = ["1a", "x", "4b", "e", "2c", "7f", "ab", "k3", "d"];
  /* art: Schlüssel aus IP.MACH (gültig) oder gross, g256, drei, fuenf, buchstabe, leer (ungültig) */
  IP.neu = art => {
    for (let n = 0; n < 200; n++) {
      let t;
      if (IP.MACH[art]) t = IP.MACH[art]();
      else {
        t = IP.MACH[U.wahl(["p192", "p192", "p10", "o", "p172"])]();
        const i = g(0, 3);
        if (art === "gross") t[i] = U.wahl([g(256, 299), g(300, 999), g(300, 400)]);
        if (art === "g256") t[i] = 256;
        if (art === "drei") t.splice(g(1, 3), 1);
        if (art === "fuenf") t.splice(g(1, 4), 0, g(0, 255));
        if (art === "buchstabe") t[g(1, 3)] = U.wahl(IP.BUCHST);
        if (art === "leer") t[g(1, 2)] = "";
      }
      const s = t.join(".");
      if (IP.frei(s)) return s;
    }
    throw new Error("kein freies " + art);
  };
  /*ENDIP*/

  const GER = { Laptop: ["der", "dem"], Handy: ["das", "dem"], Konsole: ["die", "der"], Tablet: ["das", "dem"], PC: ["der", "dem"], Fernseher: ["der", "dem"] };
  const NAMEN = ["Yilmaz", "Berger", "Kraus", "Novak", "Lang", "Demir", "Fischer", "Wolf", "Brandl", "Seidl"];
  const YT = "142.250.185.78";
  function heimnetz() {
    for (;;) {
      const netz = U.wahl([`192.168.${g(1, 60)}`, `192.168.${g(1, 60)}`, `10.0.${g(1, 40)}`]);
      const geraet = U.wahl(Object.keys(GER)), ip = `${netz}.${g(2, 99)}`;
      if (netz !== "192.168.2" && IP.frei(ip) && IP.frei(netz + ".1"))
        return { name: U.wahl(NAMEN), netz, innen: netz + ".1", aussen: IP.neu("o"), geraet, ip };
    }
  }
  const paar = zeilen => `<div class="paar">${zeilen.map(([a, b]) => `<div><span>${a}</span>${b}</div>`).join("")}</div>`;
  const anfang = s => s.split(".").slice(0, 3).join(".");
  const HEX = "0123456789abcdef";
  function ipv6() {
    for (;;) {
      const b = Array.from({ length: 8 }, (_, i) => i === 0 ? U.wahl(["2a01", "2a02", "2003", "2a00"]) :
        Array.from({ length: g(1, 4) }, () => HEX[g(0, 15)]).join("").replace(/^0+(?=.)/, ""));
      if (b.slice(1).some(x => /[a-f]/.test(x))) return b.join(":");
    }
  }

  const TYPEN = {
    gueltig() {
      const s = IP.neu(U.wahl(["p192", "p10", "o", "gross", "g256", "drei", "fuenf", "buchstabe"])), p = IP.pruefe(s);
      return { key: s, typ: "wahl", frage: "Ist diese IPv4-Adresse gültig?", bild: `<div class="adresse">${U.esc(s)}</div>`,
        optionen: ["gültig", "ungültig"], richtig: p.ok ? 0 : 1, spalten: 2, weg: `${U.esc(p.grund)} → ${p.ok ? "gültig" : "ungültig"}`,
        kurz: `<span class="ip">${U.esc(s)}</span>: gültig?` };
    },
    privat() {
      const s = IP.neu(U.wahl(["p192", "p10", "o", "o", "o10", "o192"])), a = IP.art(s);
      return { key: s, typ: "wahl", frage: "Ist diese Adresse privat oder öffentlich?", bild: `<div class="adresse">${s}</div>`,
        optionen: ["privat", "öffentlich"], richtig: a.privat ? 0 : 1, spalten: 2, weg: `${a.zeichen} → ${a.privat ? "privat" : "öffentlich"}`,
        kurz: `<span class="ip">${s}</span>: privat oder öffentlich?` };
    },
    privat172() {
      const s = IP.neu(U.wahl(["p172", "o172"])), a = IP.art(s);
      return { key: s, typ: "wahl", frage: "Ist diese Adresse privat oder öffentlich?", bild: `<div class="adresse">${s}</div>`,
        optionen: ["privat", "öffentlich"], richtig: a.privat ? 0 : 1, spalten: 2, weg: `${a.zeichen} → ${a.privat ? "privat" : "öffentlich"}`,
        kurz: `<span class="ip">${s}</span>: privat oder öffentlich?` };
    },
    sieht() {
      const f = heimnetz(), opt = U.mische([f.aussen, f.ip, f.innen, YT]);
      return { key: "sieht", typ: "wahl", frage: `${GER[f.geraet][0][0].toUpperCase() + GER[f.geraet][0].slice(1)} ${f.geraet} von Familie ${f.name} ruft ein Video beim YouTube-Server ab. Welche Adresse sieht der Server?`,
        bild: paar([[f.geraet, f.ip], ["Router innen", f.innen], ["Router außen", f.aussen], ["YouTube-Server", YT]]),
        optionen: opt, richtig: opt.indexOf(f.aussen), spalten: 2,
        weg: `Alle Geräte im Heimnetz teilen sich nach außen die öffentliche Adresse des Routers: ${f.aussen}.`,
        kurz: `${f.geraet} (${f.ip}) fragt beim YouTube-Server: Welche Adresse sieht er?`, meta: { f } };
    },
    vergabe() {
      const f = heimnetz(), oeff = Math.random() < 0.5, d = `${GER[f.geraet][1]} ${f.geraet}`;
      const r = oeff ? "der Internetanbieter" : "der Router, automatisch";
      const opt = U.mische(oeff ? [r, "der Router selbst", "der YouTube-Server"] : [r, "der Internetanbieter", "der YouTube-Server"]);
      return { key: "vergabe", typ: "wahl", frage: oeff ? `Wer gibt dem Router von Familie ${f.name} seine öffentliche Adresse ${f.aussen}?`
                                                          : `Wer gibt ${d} im Heimnetz von Familie ${f.name} die Adresse ${f.ip}?`,
        optionen: opt, richtig: opt.indexOf(r),
        weg: oeff ? "Die öffentliche Adresse bekommt der Router vom Internetanbieter." : "Im Heimnetz vergibt der Router die privaten Adressen automatisch (dynamisch).",
        meta: { oeff } };
    },
    netz() {
      for (;;) {
        const c = g(1, 60), h1 = g(2, 99), h2 = g(2, 99), ja = Math.random() < 0.5, basis = U.wahl(["192.168", "10.0"]);
        const p = `${basis}.${c}.${h1}`, q = ja ? `${basis}.${c}.${h2}` : `${basis}.${c + U.wahl([1, 2, 10])}.${h2}`;
        if (h1 === h2 || !IP.frei(p) || !IP.frei(q)) continue;
        const gl = anfang(p) === anfang(q);
        return { key: "netz", typ: "wahl", frage: "Sind die zwei Geräte im gleichen Netz?", bild: paar([["Laptop", p], ["Drucker", q]]),
          optionen: ["ja, gleiches Netz", "nein"], richtig: gl ? 0 : 1, spalten: 2,
          weg: gl ? `Gleicher Anfang ${anfang(p)}, nur die letzte Zahl ist anders → gleiches Netz.`
                  : `Der Anfang ${anfang(p)} und ${anfang(q)} ist verschieden → nicht im gleichen Netz.`,
          kurz: `${p} und ${q}: gleiches Netz?`, meta: { p, q } };
      }
    },
    anzahl() {
      const n = 256 * 256 * 256 * 256, r = "etwa 4,3 Milliarden";
      const opt = U.mische([r, "etwa 4,3 Millionen", "1024", "etwa 430 Milliarden"]);
      return { key: "anzahl", typ: "wahl", frage: "Wie viele IPv4-Adressen gibt es ungefähr?", optionen: opt, richtig: opt.indexOf(r),
        weg: `256 · 256 · 256 · 256 = ${U.de(n)}, also etwa 4,3 Milliarden. Das reicht nicht mehr für alle Geräte, deshalb gibt es IPv6.`,
        meta: { n } };
    },
    ipv6() {
      const r = ipv6();
      const v4 = IP.neu("o");
      const acht = Array.from({ length: 8 }, () => g(0, 255)).join(".");
      let fremd = ipv6().split(":");
      const i = g(1, 7), alt = fremd[i], pos = g(0, alt.length - 1);
      fremd[i] = alt.slice(0, pos) + U.wahl(["g", "k", "r", "x", "z"]) + alt.slice(pos + 1);
      fremd = fremd.join(":");
      const opt = U.mische([r, v4, acht, fremd]);
      return { key: "ipv6", typ: "wahl", frage: "Welche ist eine IPv6-Adresse?", optionen: opt.map(o => `<span class="v6">${o}</span>`),
        richtig: opt.indexOf(r), loesungText: r,
        weg: `IPv6: acht Blöcke mit Ziffern 0–9 und Buchstaben a–f, durch Doppelpunkte getrennt. In ${fremd} steht ein Buchstabe nach f.`,
        kurz: "Welche ist eine IPv6-Adresse?", meta: { r, v4, acht, fremd } };
    },
    statisch() {
      const v = g(0, 1);
      const r = v === 0 ? "dynamisch" : "statisch";
      return { key: "statisch", typ: "wahl", spalten: 2, optionen: ["statisch", "dynamisch"], richtig: v === 0 ? 1 : 0,
        frage: v === 0 ? "Der Router gibt dem Handy im Heimnetz automatisch eine Adresse. Wie heißt so eine Adresse?"
                       : "Der YouTube-Server hat immer dieselbe öffentliche Adresse. Wie heißt so eine Adresse?",
        weg: `${r}: ${v === 0 ? "wird automatisch vergeben, im Heimnetz vom Router" : "fest, bleibt gleich; Server haben feste öffentliche Adressen"}.`,
        kurz: v === 0 ? "Adresse automatisch vom Router: statisch oder dynamisch?" : "Feste Adresse eines Servers: statisch oder dynamisch?" };
    },
    moeglich() {
      return { key: "moeglich", typ: "zahl", frage: "Wie viele verschiedene Werte kann eine der vier Zahlen einer IPv4-Adresse haben?",
        loesung: 256, weg: "Von 0 bis 255: das sind 256 Möglichkeiten.", kurz: "Werte für eine Zahl der IPv4-Adresse?" };
    }
  };

  let plan = [], letzteI = -1;
  const cfg = {
    titel: "Teste dich: IP-Adresse",
    anzahl: 10,
    erzeuge(i) {
      if (i === 0 && letzteI !== 0) plan = U.mische(Object.keys(TYPEN));
      letzteI = i;
      const a = TYPEN[plan[i]](); a.art = plan[i]; return a;
    }
  };
  window.__test = { IP, TYPEN, cfg, ipv6 };
  U.runde(Object.assign({ endlos: true }, cfg));
})();
</script>
</body>
</html>
